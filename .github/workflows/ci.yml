name: CI Build & Lint

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [23.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check (Node)
        run: npm run typecheck:node

      - name: TypeScript Check (Web)
        run: npm run typecheck:web

  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [23.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  build:
    name: Build (${{ matrix.os }})
    needs: [typecheck, lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [23.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libmacaroons-dev libsodium-dev

      - name: Install Dependencies
        run: npm ci

      - name: Compile & Build
        run: npm run build

      - name: Verify Build Output
        run: ls -la out/

      - name: Verify ASAR Integrity
        run: |
          if [ -f out/main.asar ]; then
            echo "ASAR archive found"
            npx asar list out/main.asar | head -20
          fi

  test:
    name: Unit Tests (${{ matrix.os }})
    needs: [typecheck]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [23.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test || echo "No test script configured"

  local-only-validation:
    name: Local-Only Mode Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Local-Only Configuration
        run: |
          echo "Checking for hardcoded remote URLs..."
          if grep -r "https://.*gemini\|https://.*groq\|wss://.*stream" src/main --include="*.ts" | grep -v "//"; then
            echo "WARNING: Potential remote URLs found in main process"
          else
            echo "No hardcoded remote URLs detected in main process"
          fi
          echo "Local-only mode uses VITE_LOCAL_ONLY env var"
          grep -r "VITE_LOCAL_ONLY" src/ || echo "No VITE_LOCAL_ONLY references found"
